<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
	html, body { margin: 0; background: #0b0e13; color: #e8ecf2;
		font-family: "Noto Sans CJK SC", "DejaVu Sans", sans-serif; user-select: none; cursor: none; }
	body { padding: 8px; }
	.card { background: #161b23; border-radius: 10px; padding: 9px 11px; margin-bottom: 7px; }
	.row { display: flex; flex-wrap: wrap; column-gap: 8px; justify-content: space-between; align-items: baseline; }
	.row + .row { margin-top: 5px; }
	.big { font-size: 26px; font-weight: bold; font-variant-numeric: tabular-nums; white-space: nowrap; }
	.sub { color: #8b95a5; font-size: 12px; line-height: 1.5; }
	.val { font-weight: bold; font-variant-numeric: tabular-nums; }
	.warn { color: #f2c14b; }
	.good { color: #4fd18b; }
	canvas { display: block; width: 100%; height: 70px; }
</style>
</head>
<body>
<div class="card" id="now"></div>
<div class="card"><canvas id="chart"></canvas><div class="sub" id="chart-note"></div></div>
<div class="card"><canvas id="level"></canvas><div class="sub" id="level-note"></div></div>
<div class="card" id="charge" hidden></div>
<div class="card" id="avg"></div>
<div class="sub" id="note"></div>
<script src="/sdk/e5.js"></script>
<script>
'use strict';
// 功率监测: the newest sample, the last 30 minutes, the averages by state
// over the last 24 hours (unplugged only), and the charging.  Plugged in, the
// gauge reads what goes into the battery, not the device's use: the backend
// says which (now.kind: battery, charging, full, drain) and the session.
// Deep sleep takes no samples: the backend gives the sleeps (naps) and their
// average from the gauge's charge, drawn as a purple band at that level.
// Under the use, the charge over the last 24 hours (backend: level).
// The full chart and the CSV are on LuCI: 状态 -> 功率监测.
const $ = (id) => document.getElementById(id);
let st = null, loadError = null;

function esc(s) {
	return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function stateName(x) {
	if (x.sleep) return e5.t({ zh: '深度休眠', en: 'deep sleep' });
	return [x.screen ? e5.t({ zh: '亮屏', en: 'lit' }) : e5.t({ zh: '熄屏', en: 'dark' }),
		x.hotspot ? e5.t({ zh: '热点开', en: 'hotspot on' }) : e5.t({ zh: '热点关', en: 'hotspot off' }),
		x.saver ? e5.t({ zh: '省电', en: 'saver' }) : null].filter(Boolean).join(' · ');
}

function minutes(m) {
	if (m == null) return '';
	if (m < 60) return m + e5.t({ zh: ' 分钟', en: ' min' });
	return Math.floor(m / 60) + e5.t({ zh: ' 小时 ', en: ' h ' }) + (m % 60) + e5.t({ zh: ' 分', en: ' min' });
}

// the use, red, on its own scale; plugged-in stretches as a green band, the
// sleeps as a purple one with their level (when known) as a line
function drawChart() {
	const c = $('chart'), r = st?.recent ?? [], naps = st?.naps ?? [];
	const W = c.clientWidth || 300, H = 70, dpr = window.devicePixelRatio || 1;
	c.width = W * dpr; c.height = H * dpr;
	const g = c.getContext('2d');
	g.setTransform(dpr, 0, 0, dpr, 0, 0);
	g.clearRect(0, 0, W, H);
	if (r.length < 2 && !naps.length) { $('chart-note').textContent = e5.t({ zh: '最近 30 分钟：数据不够', en: 'Last 30 min: not enough data' }); return; }
	const t0 = Math.min(r[0][0], ...naps.map((z) => z[0])), t1 = r[r.length - 1][0];
	const used = r.filter((p) => !p[2]).map((p) => p[1]).sort((a, b) => a - b);
	const top = Math.max(100, (used.length ? used[Math.floor(used.length * 0.98)] : 0) * 1.1);
	const X = (t) => (t - t0) / Math.max(1, t1 - t0) * (W - 2) + 1;
	const Y = (v) => H - 2 - Math.max(0, Math.min(top, v)) / top * (H - 4);
	// (one rectangle per plugged-in run: no seams between samples)
	g.fillStyle = 'rgba(79,209,139,.18)';
	let run = null;
	for (let i = 0; i <= r.length; i++) {
		const on = i < r.length && r[i][2] && (run == null || r[i][0] - r[i - 1][0] <= 120);
		if (on) { if (run == null) run = r[i][0]; continue; }
		if (run != null) { g.fillRect(Math.round(X(run)), 0, Math.max(1, Math.round(X(r[i - 1][0]) - X(run))), H); run = null; }
		if (i < r.length && r[i][2]) run = r[i][0];
	}
	for (const [a, b, mw] of naps) {
		g.fillStyle = 'rgba(150,110,230,.22)';
		g.fillRect(Math.round(X(a)), 0, Math.max(1, Math.round(X(b) - X(a))), H);
		if (mw == null) continue;
		g.lineWidth = 1.5; g.strokeStyle = '#a98cf0';
		g.beginPath(); g.moveTo(X(a), Y(mw)); g.lineTo(X(b), Y(mw)); g.stroke();
	}
	g.lineWidth = 1.5; g.strokeStyle = '#f0625a';
	for (let i = 1; i < r.length; i++) {
		if (r[i][0] - r[i - 1][0] > 120 || r[i][2] || r[i - 1][2]) continue;
		g.beginPath(); g.moveTo(X(r[i - 1][0]), Y(r[i - 1][1])); g.lineTo(X(r[i][0]), Y(r[i][1])); g.stroke();
	}
	$('chart-note').textContent = used.length
		? e5.t({ zh: `最近 30 分钟耗电，顶部 ${Math.round(top)} mW（绿色底为插电${naps.length ? '，紫色为深度休眠' : ''}）`,
			en: `Last 30 min use, top ${Math.round(top)} mW (green: plugged in${naps.length ? ', purple: deep sleep' : ''})` })
		: e5.t({ zh: '最近 30 分钟一直插着电（绿色底），没有耗电数据', en: 'Plugged in for the last 30 min (green): no use measured' });
}

// the charge (%), on a scale of at least 10 points; plugged in as a green band
function drawLevel() {
	const c = $('level'), r = st?.level ?? [];
	const W = c.clientWidth || 300, H = 70, dpr = window.devicePixelRatio || 1;
	c.width = W * dpr; c.height = H * dpr;
	const g = c.getContext('2d');
	g.setTransform(dpr, 0, 0, dpr, 0, 0);
	g.clearRect(0, 0, W, H);
	if (r.length < 2) { $('level-note').textContent = e5.t({ zh: '电量：数据不够', en: 'Charge: not enough data' }); return; }
	const t0 = r[0][0], t1 = r[r.length - 1][0];
	const v = r.map((p) => p[1]);
	let lo = Math.min(...v), hi = Math.max(...v);
	const pad = Math.max(0, 10 - (hi - lo)) / 2;
	lo = Math.max(0, Math.floor(lo - pad)); hi = Math.min(100, Math.ceil(hi + pad));
	if (hi - lo < 10) { if (lo == 0) hi = 10; else lo = 90; }
	const X = (t) => (t - t0) / Math.max(1, t1 - t0) * (W - 2) + 1;
	const Y = (p) => H - 2 - (p - lo) / (hi - lo) * (H - 4);
	g.fillStyle = 'rgba(79,209,139,.18)';
	for (let i = 0; i + 1 < r.length; i++)
		if (r[i][2]) g.fillRect(X(r[i][0]), 0, Math.max(1, X(r[i + 1][0]) - X(r[i][0])), H);
	g.lineWidth = 1.5; g.strokeStyle = '#5aa9f0';
	g.beginPath();
	r.forEach((p, i) => { if (i) g.lineTo(X(p[0]), Y(p[1])); else g.moveTo(X(p[0]), Y(p[1])); });
	g.stroke();
	const span = minutes(Math.round((t1 - t0) / 60));
	$('level-note').textContent = e5.t({
		zh: `最近 ${span}电量 ${v[0]}% → ${v[v.length - 1]}%，纵轴 ${lo}–${hi}%（绿色底为插电）`,
		en: `Charge over ${span}: ${v[0]}% → ${v[v.length - 1]}%, scale ${lo}–${hi}% (green: plugged in)` });
}

function drawNow(x) {
	const v = `${x.ma} mA · ${(x.mv / 1000).toFixed(2)} V${x.battery != null ? ' · ' + x.battery + '%' : ''}`;
	let big, line;
	if (x.kind == 'charging') {
		big = `<span class="big good">${e5.t({ zh: '充电 ', en: 'Charging ' })}${x.charge_mw} mW</span>`;
		line = e5.t({ zh: '插电中：这是充进电池的功率，不是耗电', en: 'Plugged in: what goes into the battery, not the use' });
	} else if (x.kind == 'full') {
		big = `<span class="big good">${e5.t({ zh: '已充满', en: 'Full' })}</span>`;
		line = e5.t({ zh: '插电中：电池几乎没有电流进出，由充电器供电', en: 'Plugged in: the charger runs the device' });
	} else if (x.kind == 'drain') {
		big = `<span class="big warn">${x.mw} mW</span>`;
		line = `<span class="warn">${e5.t({ zh: '插着电，电池仍在放电：充电器供电不够', en: 'Plugged in, and the battery still drains: the charger is short' })}</span>`;
	} else {
		big = `<span class="big">${x.mw} mW</span>`;
		line = esc(stateName(x));
	}
	// (plugged, avg5 is the charging: below 0, the battery gave on average)
	const avg = st.avg5 == null ? '' : !x.plugged
		? e5.t({ zh: '5 分钟平均 ', en: '5-min avg ' }) + st.avg5 + ' mW'
		: st.avg5 >= 0 ? e5.t({ zh: '5 分钟平均充电 ', en: '5-min avg charging ' }) + st.avg5 + ' mW'
		: e5.t({ zh: '5 分钟平均放电 ', en: '5-min avg drain ' }) + (-st.avg5) + ' mW';
	$('now').innerHTML =
		`<div class="row">${big}<span class="sub">${v}</span></div>` +
		`<div class="row sub"><span>${line}</span><span>${avg}</span></div>`;
}

// the charging going on, or the last one (within 24 h)
function drawCharge() {
	const s = st.session, el = $('charge');
	if (!s) { el.hidden = true; return; }
	el.hidden = false;
	const head = s.mw == null
		? (s.active ? e5.t({ zh: '本次插电（没有充进电）', en: 'Plugged in now (nothing charged)' }) : e5.t({ zh: '上次插电（没有充进电）', en: 'Last plugged in (nothing charged)' }))
		: (s.active ? e5.t({ zh: '本次充电', en: 'This charge' }) : e5.t({ zh: '上次充电', en: 'Last charge' }));
	const rows = [];
	rows.push([e5.t({ zh: '插电时长', en: 'Plugged in' }), minutes(s.minutes)]);
	if (s.from != null && s.to != null) rows.push([e5.t({ zh: '电量', en: 'Battery' }), `${s.from}% → ${s.to}%`]);
	if (s.mw != null) rows.push([e5.t({ zh: '平均充电', en: 'Avg charging' }), `${s.mw} mW · ${s.ma} mA`]);
	if (s.pct_per_hour != null) rows.push([e5.t({ zh: '充电速度', en: 'Rate' }), `${s.pct_per_hour}% / ${e5.t({ zh: '小时', en: 'h' })}`]);
	if (s.full_minutes != null) rows.push([e5.t({ zh: '预计充满', en: 'Full in' }), e5.t({ zh: '约 ', en: 'about ' }) + minutes(s.full_minutes)]);
	el.innerHTML = `<div class="sub" style="margin-bottom:4px">${head}</div>` +
		rows.map(([k, v]) => `<div class="row"><span>${esc(k)}</span><span class="val">${esc(v)}</span></div>`).join('');
}

function draw() {
	if (!st) {
		$('now').innerHTML = loadError
			? `<div class="sub warn">${e5.t({ zh: '读取失败：', en: 'Cannot load: ' })}${esc(loadError)}</div>`
			: `<div class="sub">${e5.t({ zh: '读取中…', en: 'Loading…' })}</div>`;
		return;
	}
	const x = st.now;
	if (!x) $('now').innerHTML = `<div class="sub">${e5.t({ zh: '还没有数据：后台每 10 秒采样一次，稍等片刻。', en: 'No data yet: one sample every 10 s.' })}</div>`;
	else drawNow(x);
	drawCharge();
	// (deep sleep without enough of it to measure: its time only)
	const rows = (st.avg ?? []).slice().sort((a, b) => (a.mw ?? -1) - (b.mw ?? -1)).map((a) =>
		`<div class="row"><span>${esc(stateName(a))}</span><span><span class="val">${a.mw == null ? e5.t({ zh: '待测', en: 'n/a' }) : a.mw + ' mW'}</span> <span class="sub">${a.minutes} ${e5.t({ zh: '分钟', en: 'min' })}</span></span></div>`);
	$('avg').innerHTML = `<div class="sub" style="margin-bottom:4px">${e5.t({ zh: '最近 24 小时耗电平均（不含插电）', en: 'Last 24 h use averages (unplugged)' })}</div>` +
		(rows.length ? rows.join('') : `<div class="sub">${e5.t({ zh: '没有未插电的数据：拔掉 USB 线才能测出耗电。', en: 'No unplugged data: unplug USB to measure.' })}</div>`);
	$('note').textContent = e5.t({ zh: '完整曲线和导出：电脑浏览器打开 LuCI → 状态 → 功率监测。', en: 'Full chart and CSV: LuCI -> Status -> Power monitor.' }) +
		(st.service ? '' : e5.t({ zh: '（后台采样未运行）', en: ' (the sampler is not running)' }));
	drawChart();
	drawLevel();
}

async function load() {
	try { st = await e5.api('/status'); loadError = null; }
	catch (e) { loadError = e.message || String(e); }
	draw();
}

draw();
load();
setInterval(load, 10000);
</script>
</body>
</html>
