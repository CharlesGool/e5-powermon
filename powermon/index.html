<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
	html, body { margin: 0; background: #0b0e13; color: #e8ecf2;
		font-family: "Noto Sans CJK SC", "DejaVu Sans", sans-serif; user-select: none; cursor: none; }
	body { padding: 8px; }
	.card { background: #161b23; border-radius: 10px; padding: 9px 11px; margin-bottom: 7px; }
	.row { display: flex; flex-wrap: wrap; column-gap: 8px; justify-content: space-between; align-items: baseline; }
	.row + .row { margin-top: 5px; }
	.big { font-size: 26px; font-weight: bold; font-variant-numeric: tabular-nums; white-space: nowrap; }
	.sub { color: #8b95a5; font-size: 12px; line-height: 1.5; }
	.val { font-weight: bold; font-variant-numeric: tabular-nums; }
	.warn { color: #f2c14b; }
	.good { color: #4fd18b; }
	canvas { display: block; width: 100%; height: 100px; margin-top: 4px; }
	#spans button { background: #222935; color: #8b95a5; border: 0; border-radius: 6px; font: inherit; font-size: 12px;
		padding: 3px 8px; margin-left: 4px; }
	#spans button.on { background: #2f6fb3; color: #fff; }
</style>
</head>
<body>
<div class="card" id="now"></div>
<div class="card">
	<div class="row"><span class="sub" id="chart-title"></span><span id="spans"></span></div>
	<canvas id="chart"></canvas><div class="sub" id="chart-note"></div>
	<canvas id="level"></canvas><div class="sub" id="level-note"></div>
</div>
<div class="card" id="charge" hidden></div>
<div class="card" id="avg"></div>
<div class="sub" id="note"></div>
<script src="/sdk/e5.js"></script>
<script>
'use strict';
// 功率监测: the newest sample, the use and the charge over the last 30 min,
// 6 h or 24 h (one range for both, on the same times), the averages by state
// over the last 24 hours (unplugged only), and the charging.  Plugged in, the
// gauge reads what goes into the battery, not the device's use: the backend
// says which (now.kind: battery, charging, full, drain) and the session.
// Deep sleep takes no samples: the backend gives the sleeps (naps) and their
// average from the gauge's charge, drawn as a purple band at that level.
// The full chart and the CSV are on LuCI: 状态 -> 功率监测.
const $ = (id) => document.getElementById(id);
let st = null, loadError = null;

function esc(s) {
	return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function stateName(x) {
	if (x.sleep) return e5.t({ zh: '深度休眠', en: 'deep sleep' });
	return [x.screen ? e5.t({ zh: '亮屏', en: 'lit' }) : e5.t({ zh: '熄屏', en: 'dark' }),
		x.hotspot ? e5.t({ zh: '热点开', en: 'hotspot on' }) : e5.t({ zh: '热点关', en: 'hotspot off' }),
		x.saver ? e5.t({ zh: '省电', en: 'saver' }) : null].filter(Boolean).join(' · ');
}

function minutes(m) {
	if (m == null) return '';
	if (m < 60) return m + e5.t({ zh: ' 分钟', en: ' min' });
	return Math.floor(m / 60) + e5.t({ zh: ' 小时 ', en: ' h ' }) + (m % 60) + e5.t({ zh: ' 分', en: ' min' });
}

const SPANS = [[1800, { zh: '30 分钟', en: '30 min' }], [6 * 3600, { zh: '6 小时', en: '6 h' }], [24 * 3600, { zh: '24 小时', en: '24 h' }]];
let span = 1800;
try { span = +localStorage.getItem('powermon.span') || 1800; } catch (e) {}
if (!SPANS.some(([s]) => s == span)) span = 1800;

// a chart's canvas, sized, and its plot box: the left margin for the value
// labels, the bottom one for the times -- the same in both charts, so their
// times line up
const AX = { L: 40, R: 4, T: 5, B: 16, H: 100 };
function frame(id) {
	const c = $(id), W = c.clientWidth || 300, dpr = window.devicePixelRatio || 1;
	c.width = W * dpr; c.height = AX.H * dpr;
	const g = c.getContext('2d');
	g.setTransform(dpr, 0, 0, dpr, 0, 0);
	g.clearRect(0, 0, W, AX.H);
	g.font = '10px "Noto Sans CJK SC", "DejaVu Sans", sans-serif';
	return { g, W, x0: AX.L, x1: W - AX.R, y0: AX.T, y1: AX.H - AX.B };
}

// the plugged-in (green) and asleep (purple) bands, value gridlines with
// labels, the time axis: what both charts have
function axes(f, c, X, Y, ticks, label) {
	const { g, x0, x1, y0, y1 } = f, gap = Math.max(150, c.width * 2.5);
	g.fillStyle = 'rgba(79,209,139,.18)';
	c.pts.forEach((p, i) => {
		if (!p[2]) return;
		const a = i && p[0] - c.pts[i - 1][0] <= gap ? c.pts[i - 1][0] : p[0] - c.width;
		g.fillRect(X(Math.max(c.from, a)), y0, Math.max(1, X(p[0]) - X(Math.max(c.from, a))), y1 - y0);
	});
	g.fillStyle = 'rgba(150,110,230,.25)';
	for (const [a, b] of c.naps) g.fillRect(X(a), y0, Math.max(1, X(b) - X(a)), y1 - y0);
	g.strokeStyle = 'rgba(139,149,165,.25)'; g.fillStyle = '#8b95a5'; g.lineWidth = 1;
	g.textAlign = 'right'; g.textBaseline = 'middle';
	for (const v of ticks) {
		const y = Math.round(Y(v)) + .5;
		g.beginPath(); g.moveTo(x0, y); g.lineTo(x1, y); g.stroke();
		g.fillText(label(v), x0 - 4, Math.min(y1 - 4, Math.max(y0 + 4, y)));
	}
	const sp = c.to - c.from, fit = Math.max(2, Math.floor((x1 - x0) / 48));
	const step = [300, 600, 900, 1800, 3600, 7200, 10800, 21600].find((v) => sp / v <= fit) || 43200;
	const p2 = (n) => String(n).padStart(2, '0');
	g.textAlign = 'center'; g.textBaseline = 'top';
	for (let t = Math.ceil(c.from / step) * step; t <= c.to; t += step) {
		const x = Math.round(X(t)) + .5, d = new Date(t * 1000);
		g.beginPath(); g.moveTo(x, y0); g.lineTo(x, y1); g.stroke();
		const s = p2(d.getHours()) + ':' + p2(d.getMinutes()), w = g.measureText(s).width / 2;
		g.fillText(s, Math.min(x1 - w, Math.max(x0 + w, x)), y1 + 3);
	}
	g.strokeStyle = 'rgba(139,149,165,.6)';
	g.beginPath(); g.moveTo(x0 + .5, y0); g.lineTo(x0 + .5, y1 + .5); g.lineTo(x1, y1 + .5); g.stroke();
}

// the use (red) over the range, and the sleeps' (purple, when known); the
// charge (blue) under it, on the same times
function drawCharts() {
	const c = st?.charts?.[span];
	document.querySelectorAll('#spans button').forEach((b) => b.classList.toggle('on', +b.dataset.span == span));
	const pf = frame('chart'), lf = frame('level');
	if (!c || c.to - c.from < 60 || c.pts.length + c.naps.length < 2) {
		$('chart-note').textContent = e5.t({ zh: '数据不够：采样开始后过一会儿再看', en: 'Not enough data yet' });
		$('level-note').textContent = '';
		return;
	}
	const X = (t) => pf.x0 + (t - c.from) / Math.max(1, c.to - c.from) * (pf.x1 - pf.x0);
	const gap = Math.max(150, c.width * 2.5);

	// the use: its scale from the unplugged steps and the sleeps
	const used = c.pts.filter((p) => p[1] != null).map((p) => p[1])
		.concat(c.naps.filter((z) => z[2] != null).map((z) => z[2])).sort((a, b) => a - b);
	let top = Math.max(100, (used.length ? used[Math.floor(used.length * 0.98)] : 0) * 1.1);
	const step = [50, 100, 200, 250, 500, 1000, 2000].find((v) => top / v <= 3) || 5000;
	top = Math.ceil(top / step) * step;
	const Yp = (v) => pf.y1 - Math.max(0, Math.min(top, v)) / top * (pf.y1 - pf.y0);
	const ticks = [];
	for (let v = 0; v <= top; v += step) ticks.push(v);
	axes(pf, c, X, Yp, ticks, (v) => v >= 1000 ? (v / 1000) + ' W' : v + (v ? ' mW' : ''));
	const g = pf.g;
	g.lineWidth = 1.5; g.strokeStyle = '#a98cf0';
	for (const [a, b, mw] of c.naps) {
		if (mw == null) continue;
		g.beginPath(); g.moveTo(X(a), Yp(mw)); g.lineTo(X(b), Yp(mw)); g.stroke();
	}
	g.strokeStyle = '#f0625a';
	for (let i = 1; i < c.pts.length; i++) {
		const p = c.pts[i - 1], q = c.pts[i];
		if (p[1] == null || q[1] == null || p[2] || q[2] || q[0] - p[0] > gap) continue;
		g.beginPath(); g.moveTo(X(p[0]), Yp(p[1])); g.lineTo(X(q[0]), Yp(q[1])); g.stroke();
	}
	$('chart-note').innerHTML = e5.t({
		zh: '<span style="color:#f0625a">━</span> 耗电　<span style="color:#a98cf0">━</span> 休眠估算　绿底 插电　紫底 深度休眠',
		en: '<span style="color:#f0625a">━</span> use　<span style="color:#a98cf0">━</span> asleep (est.)　green: plugged in　purple: deep sleep' });

	// the charge: a scale of at least 10 points, on multiples of 5
	const v = c.pts.filter((p) => p[3] != null);
	if (!v.length) { $('level-note').textContent = ''; return; }
	let lo = Math.floor(Math.min(...v.map((p) => p[3])) / 5) * 5, hi = Math.ceil(Math.max(...v.map((p) => p[3])) / 5) * 5;
	if (hi - lo < 10) hi = lo + 10;
	if (hi > 100) { lo -= hi - 100; hi = 100; }
	const Yl = (p) => lf.y1 - (p - lo) / (hi - lo) * (lf.y1 - lf.y0);
	axes(lf, c, X, Yl, (hi - lo) % 10 == 0 ? [lo, (lo + hi) / 2, hi] : [lo, hi], (p) => p + '%');
	lf.g.lineWidth = 1.5; lf.g.strokeStyle = '#5aa9f0';
	lf.g.beginPath();
	v.forEach((p, i) => { if (i) lf.g.lineTo(X(p[0]), Yl(p[3])); else lf.g.moveTo(X(p[0]), Yl(p[3])); });
	lf.g.stroke();
	$('level-note').innerHTML = e5.t({
		zh: `<span style="color:#5aa9f0">━</span> 电量 ${v[0][3]}% → ${v[v.length - 1][3]}%`,
		en: `<span style="color:#5aa9f0">━</span> charge ${v[0][3]}% → ${v[v.length - 1][3]}%` });
}

function drawNow(x) {
	const v = `${x.ma} mA · ${(x.mv / 1000).toFixed(2)} V${x.battery != null ? ' · ' + x.battery + '%' : ''}`;
	let big, line;
	if (x.kind == 'charging') {
		big = `<span class="big good">${e5.t({ zh: '充电 ', en: 'Charging ' })}${x.charge_mw} mW</span>`;
		line = e5.t({ zh: '插电中：这是充进电池的功率，不是耗电', en: 'Plugged in: what goes into the battery, not the use' });
	} else if (x.kind == 'full') {
		big = `<span class="big good">${e5.t({ zh: '已充满', en: 'Full' })}</span>`;
		line = e5.t({ zh: '插电中：电池几乎没有电流进出，由充电器供电', en: 'Plugged in: the charger runs the device' });
	} else if (x.kind == 'drain') {
		big = `<span class="big warn">${x.mw} mW</span>`;
		line = `<span class="warn">${e5.t({ zh: '正在充电，但电池仍在放电：USB 口供电不足（如电脑的 500 mA 口）', en: 'Charging, yet the battery still drains: the USB port gives too little (a computer\'s 500 mA)' })}</span>`;
	} else {
		big = `<span class="big">${x.mw} mW</span>`;
		line = esc(stateName(x));
		// (plugged in, the charger held off: the battery runs the device, this is the use)
		if (x.held) line += ' · ' + e5.t({ zh: '插着电，未在充电（充电保护或已充满），由电池供电', en: 'plugged in, not charging (limit or full): on battery' });
	}
	// (plugged, avg5 is the charging: below 0, the battery gave on average)
	const avg = st.avg5 == null ? '' : !x.plugged
		? e5.t({ zh: '5 分钟平均 ', en: '5-min avg ' }) + st.avg5 + ' mW'
		: st.avg5 >= 0 ? e5.t({ zh: '5 分钟平均充电 ', en: '5-min avg charging ' }) + st.avg5 + ' mW'
		: e5.t({ zh: '5 分钟平均放电 ', en: '5-min avg drain ' }) + (-st.avg5) + ' mW';
	$('now').innerHTML =
		`<div class="row">${big}<span class="sub">${v}</span></div>` +
		`<div class="row sub"><span>${line}</span><span>${avg}</span></div>`;
}

// the charging going on, or the last one (within 24 h)
function drawCharge() {
	const s = st.session, el = $('charge');
	if (!s) { el.hidden = true; return; }
	el.hidden = false;
	const head = s.mw == null
		? (s.active ? e5.t({ zh: '本次插电（没有充进电）', en: 'Plugged in now (nothing charged)' }) : e5.t({ zh: '上次插电（没有充进电）', en: 'Last plugged in (nothing charged)' }))
		: (s.active ? e5.t({ zh: '本次充电', en: 'This charge' }) : e5.t({ zh: '上次充电', en: 'Last charge' }));
	const rows = [];
	rows.push([e5.t({ zh: '插电时长', en: 'Plugged in' }), minutes(s.minutes)]);
	if (s.from != null && s.to != null) rows.push([e5.t({ zh: '电量', en: 'Battery' }), `${s.from}% → ${s.to}%`]);
	if (s.mw != null) rows.push([e5.t({ zh: '平均充电', en: 'Avg charging' }), `${s.mw} mW · ${s.ma} mA`]);
	if (s.pct_per_hour != null) rows.push([e5.t({ zh: '充电速度', en: 'Rate' }), `${s.pct_per_hour}% / ${e5.t({ zh: '小时', en: 'h' })}`]);
	if (s.full_minutes != null) rows.push([e5.t({ zh: '预计充满', en: 'Full in' }), e5.t({ zh: '约 ', en: 'about ' }) + minutes(s.full_minutes)]);
	el.innerHTML = `<div class="sub" style="margin-bottom:4px">${head}</div>` +
		rows.map(([k, v]) => `<div class="row"><span>${esc(k)}</span><span class="val">${esc(v)}</span></div>`).join('');
}

function draw() {
	if (!st) {
		$('now').innerHTML = loadError
			? `<div class="sub warn">${e5.t({ zh: '读取失败：', en: 'Cannot load: ' })}${esc(loadError)}</div>`
			: `<div class="sub">${e5.t({ zh: '读取中…', en: 'Loading…' })}</div>`;
		return;
	}
	const x = st.now;
	if (!x) $('now').innerHTML = `<div class="sub">${e5.t({ zh: '还没有数据：后台每 10 秒采样一次，稍等片刻。', en: 'No data yet: one sample every 10 s.' })}</div>`;
	else drawNow(x);
	drawCharge();
	// (deep sleep without enough of it to measure: its time only)
	const rows = (st.avg ?? []).slice().sort((a, b) => (a.mw ?? -1) - (b.mw ?? -1)).map((a) =>
		`<div class="row"><span>${esc(stateName(a))}</span><span><span class="val">${a.mw == null ? e5.t({ zh: '待测', en: 'n/a' }) : a.mw + ' mW'}</span> <span class="sub">${a.minutes} ${e5.t({ zh: '分钟', en: 'min' })}</span></span></div>`);
	$('avg').innerHTML = `<div class="sub" style="margin-bottom:4px">${e5.t({ zh: '最近 24 小时耗电平均（不含插电）', en: 'Last 24 h use averages (unplugged)' })}</div>` +
		(rows.length ? rows.join('') : `<div class="sub">${e5.t({ zh: '没有未插电的数据：拔掉 USB 线才能测出耗电。', en: 'No unplugged data: unplug USB to measure.' })}</div>`);
	$('note').textContent = e5.t({ zh: '完整曲线和导出：电脑浏览器打开 LuCI → 状态 → 功率监测。', en: 'Full chart and CSV: LuCI -> Status -> Power monitor.' }) +
		(st.service ? '' : e5.t({ zh: '（后台采样未运行）', en: ' (the sampler is not running)' }));
	drawCharts();
}

async function load() {
	try { st = await e5.api('/status'); loadError = null; }
	catch (e) { loadError = e.message || String(e); }
	draw();
}

$('chart-title').textContent = e5.t({ zh: '耗电与电量', en: 'Use and charge' });
$('spans').innerHTML = SPANS.map(([s, l]) => `<button data-span="${s}">${esc(e5.t(l))}</button>`).join('');
$('spans').addEventListener('click', (ev) => {
	const s = +ev.target.dataset?.span;
	if (!s) return;
	span = s;
	try { localStorage.setItem('powermon.span', String(s)); } catch (e) {}
	drawCharts();
});
draw();
load();
setInterval(load, 10000);
</script>
</body>
</html>
